<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin Park - Portfolio</title>
    <meta name="description" content="Benjamin Park's personal portfolio - Computer Science student at Penn State">
    <link rel="stylesheet" href="styles/xp.css">
    <link rel="stylesheet" href="styles/desktop.css">
</head>

<body>
    <!-- Icon library: every icon on the site is drawn once here, then reused
         with <use href="#icon-name">. This keeps all icons in one style. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <!-- Resume: white document with folded corner and a red PDF tag -->
            <symbol id="i-resume" viewBox="0 0 32 32">
                <path d="M7 3h13l5 5v21H7z" fill="#FFF" stroke="#6B7A8C" stroke-width="1.5" stroke-linejoin="round" />
                <path d="M20 3v5h5" fill="#E8EDF2" stroke="#6B7A8C" stroke-width="1.5" stroke-linejoin="round" />
                <rect x="10" y="11" width="12" height="1.6" rx="0.8" fill="#B8C4CF" />
                <rect x="10" y="15" width="12" height="1.6" rx="0.8" fill="#B8C4CF" />
                <rect x="9" y="19" width="14" height="7" rx="1.5" fill="#E74C3C" />
                <text x="16" y="24.4" text-anchor="middle" fill="#FFF" font-size="5" font-weight="bold"
                    font-family="Tahoma, sans-serif">PDF</text>
            </symbol>

            <!-- Projects: yellow folder with a code mark -->
            <symbol id="i-projects" viewBox="0 0 32 32">
                <path d="M3 8c0-1.1.9-2 2-2h8l2 2h12c1.1 0 2 .9 2 2v16c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V8z"
                    fill="#F7D774" stroke="#C9A94E" stroke-width="1" />
                <path d="M3 11h26v15c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V11z" fill="#FFEB99" />
                <text x="16" y="24" text-anchor="middle" fill="#8A6D1F" font-size="9" font-weight="bold"
                    font-family="Consolas, monospace">&lt;/&gt;</text>
            </symbol>

            <!-- About: notepad with a pencil resting on it -->
            <symbol id="i-about" viewBox="0 0 32 32">
                <rect x="5" y="3" width="20" height="26" rx="1.5" fill="#FFF" stroke="#6B7A8C" stroke-width="1.5" />
                <rect x="8" y="8" width="10" height="2" rx="1" fill="#4A5560" />
                <rect x="8" y="13" width="14" height="1.5" rx="0.75" fill="#B8C4CF" />
                <rect x="8" y="17" width="12" height="1.5" rx="0.75" fill="#B8C4CF" />
                <rect x="8" y="21" width="14" height="1.5" rx="0.75" fill="#B8C4CF" />
                <path d="M19.5 21.5l7-7 2.8 2.8-7 7-3.6.8.8-3.6z" fill="#F7D774" stroke="#6B7A8C" stroke-width="1"
                    stroke-linejoin="round" />
            </symbol>

            <!-- Contact: envelope -->
            <symbol id="i-contact" viewBox="0 0 32 32">
                <rect x="3" y="7" width="26" height="18" rx="2" fill="#FFF" stroke="#3B82F6" stroke-width="1.8" />
                <path d="M5 9.5l11 8 11-8" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-linejoin="round" />
            </symbol>

            <!-- Terminal: a dark command-prompt window with a ">_" prompt -->
            <symbol id="i-terminal" viewBox="0 0 32 32">
                <rect x="3" y="5" width="26" height="22" rx="2" fill="#101418" stroke="#6B7A8C" stroke-width="1.5" />
                <path d="M7.5 12.5l5 4-5 4" fill="none" stroke="#3DDC63" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <rect x="15.5" y="19" width="8" height="2" rx="1" fill="#3DDC63" />
            </symbol>

            <!-- Speaker with sound waves (uses the text color where it is placed) -->
            <symbol id="i-speaker" viewBox="0 0 32 32">
                <path d="M6 12h5l7-6v20l-7-6H6z" fill="currentColor" />
                <path d="M21 12c2 2 2 6 0 8M24.5 9c3.5 3.5 3.5 10.5 0 14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" />
            </symbol>

            <!-- Speaker muted: same speaker with an X instead of waves -->
            <symbol id="i-speaker-off" viewBox="0 0 32 32">
                <path d="M6 12h5l7-6v20l-7-6H6z" fill="currentColor" />
                <path d="M21 12.5l7 7M28 12.5l-7 7" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </symbol>

            <!-- Power symbol for the Turn Off button -->
            <symbol id="i-power" viewBox="0 0 32 32">
                <path d="M11 9.5a10 10 0 1 0 10 0" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" />
                <line x1="16" y1="4" x2="16" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            </symbol>

            <!-- Simple person silhouette for the start menu header -->
            <symbol id="i-user" viewBox="0 0 32 32">
                <circle cx="16" cy="11" r="6" fill="currentColor" />
                <path d="M4.5 28c1.2-6.5 6-9 11.5-9s10.3 2.5 11.5 9z" fill="currentColor" />
            </symbol>
        </defs>
    </svg>

    <div id="desktop">
        <!-- Desktop Icons -->
        <div class="desktop-icon" data-target="resume">
            <div class="icon-img">
                <svg viewBox="0 0 32 32"><use href="#i-resume" /></svg>
            </div>
            <div class="icon-label">Resume</div>
        </div>

        <div class="desktop-icon" data-target="projects">
            <div class="icon-img">
                <svg viewBox="0 0 32 32"><use href="#i-projects" /></svg>
            </div>
            <div class="icon-label">My Projects</div>
        </div>

        <div class="desktop-icon" data-target="about">
            <div class="icon-img">
                <svg viewBox="0 0 32 32"><use href="#i-about" /></svg>
            </div>
            <div class="icon-label">About Me</div>
        </div>

        <div class="desktop-icon" data-target="contact">
            <div class="icon-img">
                <svg viewBox="0 0 32 32"><use href="#i-contact" /></svg>
            </div>
            <div class="icon-label">Contact</div>
        </div>

        <!-- Windows will be injected here -->
        <div id="window-area"></div>
    </div>

    <div id="taskbar">
        <button id="start-button">
            <!-- BP monogram instead of the Windows logo: this is Benjamin's machine -->
            <svg class="start-icon" viewBox="0 0 20 20" fill="none">
                <rect x="1" y="1" width="18" height="18" rx="4.5" fill="rgba(255,255,255,0.18)" stroke="#FFF"
                    stroke-width="1.5" />
                <text x="10" y="14" text-anchor="middle" fill="#FFF" font-size="9.5" font-weight="bold"
                    font-family="Tahoma, sans-serif" font-style="normal">BP</text>
            </svg>
            start
        </button>
        <div id="taskbar-divider"></div>
        <div id="taskbar-apps">
            <!-- Active windows -->
        </div>
        <div id="system-tray">
            <svg id="volume-icon" viewBox="0 0 32 32" role="button" tabindex="0" title="Sound On">
                <use id="volume-icon-use" href="#i-speaker" />
            </svg>
            <div id="clock">12:00 PM</div>
        </div>
    </div>

    <div id="start-menu" class="hidden">
        <div class="start-header">
            <div class="user-account">
                <svg class="user-icon" viewBox="0 0 32 32"><use href="#i-user" /></svg>
                <span class="username">Benjamin Park</span>
            </div>
        </div>
        <div class="start-body">
            <div class="start-column-left">
                <div class="start-item" data-action="resume">
                    <svg class="menu-icon" viewBox="0 0 32 32"><use href="#i-resume" /></svg>
                    <span>My Resume</span>
                </div>
                <div class="start-item" data-action="projects">
                    <svg class="menu-icon" viewBox="0 0 32 32"><use href="#i-projects" /></svg>
                    <span>My Projects</span>
                </div>
                <div class="start-item" data-action="about">
                    <svg class="menu-icon" viewBox="0 0 32 32"><use href="#i-about" /></svg>
                    <span>About Me</span>
                </div>
                <div class="start-item" data-action="contact">
                    <svg class="menu-icon" viewBox="0 0 32 32"><use href="#i-contact" /></svg>
                    <span>Contact</span>
                </div>
            </div>
            <div class="start-column-right">
                <div class="start-item" id="toggle-sound">
                    <svg class="menu-icon" viewBox="0 0 32 32"><use id="menu-sound-use" href="#i-speaker" /></svg>
                    <span id="menu-sound-text">Sound: ON</span>
                </div>
            </div>
        </div>
        <div class="start-footer">
            <div class="start-button-footer" id="btn-shutdown">
                <svg class="menu-icon" viewBox="0 0 32 32"><use href="#i-power" /></svg>
                <span>Turn Off</span>
            </div>
        </div>
    </div>

    <!-- PDF.js renders the resume PDF onto the page directly, because the
         browser's built-in PDF viewer is unreliable inside embedded frames
         (blank on iPad and some desktop setups). -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Scripts -->
    <script src="scripts/sounds.js"></script>
    <script src="scripts/windowManager.js"></script>
    <script src="scripts/app.js"></script>
</body>

</html>
